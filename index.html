VIEWS.sayim = async el => {
  const id = +(new URLSearchParams(location.hash.split('?')[1] || '').get('id')) || null;
  if (id) return sayimDetay(el, id);
  const {data, error} = await S.sb.from('sayimlar').select('*').order('id', {ascending: false}).limit(50);
  if (error) throw error;
  const DURUM = {acik: '<span class="tag y">Açık</span>', tamamlandi: '<span class="tag g">Tamamlandı</span>', iptal: '<span class="tag r">İptal</span>'};
  $('#ust').innerHTML = `<button class="btn gold" id="yeni">${ic('arti')} Yeni Sayım</button>`;
  el.innerHTML = `<div class="warn">Sayımda yalnızca sayılan ürünler değerlendirilir. Tamamlandığında fazla çıkanlar <b>Sayım fazlası</b> giriş fişi, eksik çıkanlar <b>Sayım eksiği</b> çıkış fişi olarak otomatik işlenir.</div>
  <div class="glass tw">${data.length ? `<table class="rt"><thead><tr><th>#</th><th>Açıklama</th><th>Durum</th><th>Başlatan</th><th>Başlangıç</th><th>Tamamlanma</th></tr></thead><tbody>
  ${data.map(s => `<tr class="cl" data-s="${s.id}"><td class="hd" data-l="#">Sayım #${s.id}</td><td data-l="Açıklama">${esc(s.aciklama || '—')}</td><td data-l="Durum">${DURUM[s.durum]}</td><td data-l="Başlatan">${esc(s.olusturan_adi)}</td><td class="num" data-l="Başlangıç">${esc(fTarih(s.created_at))}</td><td class="num" data-l="Tamamlanma">${esc(s.tamamlandi_at ? fTarih(s.tamamlandi_at) + ' · ' + (s.tamamlayan_adi || '') : '—')}</td></tr>`).join('')}
  </tbody></table>` : '<div class="empty">Henüz sayım yapılmadı.</div>'}</div>`;
  $$('[data-s]', el).forEach(tr => tr.onclick = () => location.hash = '#/sayim?id=' + tr.dataset.s);
  $('#yeni').onclick = () => {
    const m = modal({
      baslik: 'Yeni Sayım',
      govde: `<label class="f"><span>Açıklama</span><input class="inp" id="sa" maxlength="300" placeholder="Örn. Kasım ayı genel sayım"></label>`,
      alt: `<button class="btn" data-kapat>Vazgeç</button><button class="btn gold" data-ok>Sayımı Başlat</button>`
    });
    $('[data-ok]', m).onclick = e => mesgul(e.currentTarget, async () => {
      const {data: sid, error} = await S.sb.rpc('sayim_baslat', {p_aciklama: $('#sa', m).value.trim()});
      if (error) return toast(hataMesaji(error), 'err');
      m.kapat(); location.hash = '#/sayim?id=' + sid;
    });
  };
  S.canli = {sayimDurum: debounce(() => { if (S.rota === 'sayim' && !location.hash.includes('id=') && !document.querySelector('.ov') && document.visibilityState === 'visible') rotala(); }, 800)};
};

async function sayimDetay(el, id) {
  await stokYenile();
  const [{data: s, error: e1}, {data: sat, error: e2}] = await Promise.all([
    S.sb.from('sayimlar').select('*').eq('id', id).single(),
    S.sb.from('sayim_satirlari').select('*').eq('sayim_id', id).limit(20000)
  ]);
  if (e1 || e2) throw e1 || e2;
  const acik = s.durum === 'acik';
  const fiili = Object.fromEntries(sat.map(x => [x.varyant_id, x.fiili]));
  $('#baslik').textContent = `Sayım #${s.id}`;
  $('#ust').innerHTML = `<a class="btn" href="#/sayim">Listeye dön</a>`;
  el.innerHTML = `
  ${acik ? '' : `<div class="warn">Bu sayım ${s.durum === 'tamamlandi' ? 'tamamlanmış' : 'iptal edilmiş'}; değişiklik yapılamaz.</div>`}
  <div class="glass card" style="margin-bottom:14px"><div class="row">
    <div><b>${esc(s.aciklama || 'Sayım')}</b><div class="sub">Başlatan: ${esc(s.olusturan_adi)} · ${esc(fTarih(s.created_at))}</div></div><span class="sp"></span>
    <div id="sozet" class="row"></div></div></div>
  <div class="glass filters">
    <label class="f"><span>Ara</span><input class="inp" id="q" placeholder="Model, SKU, renk…"></label>
    <label class="f"><span>Göster</span><select class="inp" id="gos"><option value="">Tümü</option><option value="sayilan">Sayılanlar</option><option value="sayilmayan">Sayılmayanlar</option><option value="fark">Farklı olanlar</option></select></label>
  </div>
  <div class="glass tw" id="liste"></div>
  ${acik ? `<div class="row end" style="margin-top:14px"><button class="btn red" id="iptal">Sayımı İptal Et</button><button class="btn gold" id="bitir">Sayımı Tamamla</button></div>` : ''}`;
  const ozet = () => {
    const ids = Object.keys(fiili);
    let artı = 0, eksi = 0;
    ids.forEach(i => { const d = fiili[i] - (S.vmap[i]?.miktar || 0); if (d > 0) artı += d; else eksi -= d; });
    $('#sozet').innerHTML = `<span class="tag y">Sayılan: ${fAdet(ids.length)}</span><span class="tag g">Fazla: +${fAdet(artı)}</span><span class="tag r">Eksik: −${fAdet(eksi)}</span>`;
  };
  const zaman = {}, islemler = new Set();
  const kaydet = async (vid, inp) => {
    const s = inp.value.trim();
    if (s === '') {
      const {error} = await S.sb.from('sayim_satirlari').delete().eq('sayim_id', id).eq('varyant_id', vid);
      if (error) return toast(hataMesaji(error), 'err');
      delete fiili[vid];
    } else {
      const n = Number(s);
      if (!Number.isInteger(n) || n < 0 || n > 1000000) { inp.style.borderColor = 'var(--red)'; return toast('Sayım miktarı 0 veya pozitif tam sayı olmalı.', 'err'); }
      const {error} = await S.sb.from('sayim_satirlari').upsert({sayim_id: id, varyant_id: vid, fiili: n});
      if (error) { inp.style.borderColor = 'var(--red)'; return toast(hataMesaji(error), 'err'); }
      fiili[vid] = n;
    }
    inp.style.borderColor = 'var(--green)';
    const tr = inp.closest('tr'), fk = $('[data-fark]', tr), sis = S.vmap[vid]?.miktar || 0;
    const d = fiili[vid] === undefined ? null : fiili[vid] - sis;
    fk.innerHTML = d === null ? '—' : `<span class="${d > 0 ? 'green-t' : d < 0 ? 'red-t' : ''}">${d > 0 ? '+' : d < 0 ? '−' : ''}${fAdet(Math.abs(d))}</span>`;
    ozet();
  };
  const planla = (vid, inp, hemen = false) => {
    clearTimeout(zaman[vid]?.t);
    const calis = () => { delete zaman[vid]; const pr = kaydet(vid, inp).finally(() => islemler.delete(pr)); islemler.add(pr); return pr; };
    if (hemen) return calis();
    zaman[vid] = {t: setTimeout(calis, 450), calis};
  };
  const bosalt = async () => { Object.values(zaman).forEach(z => { clearTimeout(z.t); z.calis(); }); await Promise.all([...islemler]); };
  const ciz = () => {
    const q = trLower($('#q').value).split(/\s+/).filter(Boolean), gos = $('#gos').value;
    const l = S.varyantlar.filter(v => {
      const u = S.umap[v.urun_id] || {};
      const sayildi = fiili[v.id] !== undefined;
      if (!sayildi && (!v.aktif || u.aktif === false)) return false;
      if (gos === 'sayilan' && !sayildi) return false;
      if (gos === 'sayilmayan' && sayildi) return false;
      if (gos === 'fark' && (!sayildi || fiili[v.id] === v.miktar)) return false;
      return q.every(t => trLower(`${u.model_kodu} ${u.model_adi} ${v.sku} ${v.renk} ${v.kumas} ${v.ebat}`).includes(t));
    }).slice(0, 400);
    $('#liste').innerHTML = l.length ? `<table class="rt"><thead><tr><th>Ürün</th><th>SKU</th><th class="r">Sistem</th><th class="r" style="width:150px">Sayılan</th><th class="r">Fark</th></tr></thead><tbody>
    ${l.map(v => { const f = fiili[v.id]; const d = f === undefined ? null : f - v.miktar; return `<tr data-row="${v.id}">
      <td class="hd" data-l="Ürün">${esc(vTam(v))}</td><td data-l="SKU">${esc(v.sku)}</td>
      <td class="r num" data-l="Sistem" data-sis>${fAdet(v.miktar)}</td>
      <td class="r" data-l="Sayılan">${acik ? `<input class="inp num" style="max-width:130px;text-align:right" type="number" inputmode="numeric" min="0" step="1" data-sv="${v.id}" value="${f ?? ''}" placeholder="—">` : `<span class="num">${f === undefined ? '—' : fAdet(f)}</span>`}</td>
      <td class="r num" data-l="Fark" data-fark>${d === null ? '—' : `<span class="${d > 0 ? 'green-t' : d < 0 ? 'red-t' : ''}">${d > 0 ? '+' : d < 0 ? '−' : ''}${fAdet(Math.abs(d))}</span>`}</td></tr>`; }).join('')}
    </tbody></table>${l.length === 400 ? '<div class="empty">İlk 400 kayıt gösteriliyor; aramayla daraltın.</div>' : ''}` : '<div class="empty">Kayıt yok.</div>';
    $$('[data-sv]', el).forEach(inp => {
      const vid = +inp.dataset.sv;
      inp.oninput = () => { inp.style.borderColor = 'var(--gold)'; planla(vid, inp); };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const all = $$('[data-sv]', el); all[all.indexOf(inp) + 1]?.focus(); } };
    });
  };
  $('#q').oninput = debounce(ciz, 150);
  $('#gos').onchange = ciz;
  ciz(); ozet();
  const farkH = d => d === null ? '—' : `<span class="${d > 0 ? 'green-t' : d < 0 ? 'red-t' : ''}">${d > 0 ? '+' : d < 0 ? '−' : ''}${fAdet(Math.abs(d))}</span>`;
  const satirTazele = tr => {
    const vid = +tr.dataset.row, v = S.vmap[vid]; if (!v) return;
    $('[data-sis]', tr).textContent = fAdet(v.miktar);
    $('[data-fark]', tr).innerHTML = farkH(fiili[vid] === undefined ? null : fiili[vid] - v.miktar);
  };
  S.canli = {
    yerel: () => { $$('tr[data-row]', el).forEach(satirTazele); ozet(); },
    sayimSatir: p => {
      const r = p.eventType === 'DELETE' ? p.old : p.new;
      if (!r || r.sayim_id !== id) return;
      if (zaman[r.varyant_id]) return;
      if (p.eventType === 'DELETE') delete fiili[r.varyant_id]; else fiili[r.varyant_id] = r.fiili;
      const inp = $(`[data-sv="${r.varyant_id}"]`, el);
      if (inp && document.activeElement !== inp) inp.value = fiili[r.varyant_id] ?? '';
      const tr = $(`tr[data-row="${r.varyant_id}"]`, el);
      if (tr) satirTazele(tr);
      ozet();
    },
    sayimDurum: r => {
      if (!r || r.id !== id || !acik || r.durum === 'acik') return;
      toast(r.durum === 'tamamlandi' ? 'Bu sayım başka bir kullanıcı tarafından tamamlandı.' : 'Bu sayım iptal edildi.');
      rotala();
    }
  };
  if (acik) {
    $('#bitir').onclick = async e => {
      const btn = e.currentTarget;
      await bosalt();
      const n = Object.keys(fiili).length;
      if (!n) return toast('Henüz hiçbir ürün sayılmadı.', 'err');
      if (!await onayla('Sayımı tamamla', `${n} ürünün sayım sonucu stoğa işlenecek ve farklar için otomatik fiş kesilecek. Bu işlem geri alınamaz (gerekirse fiş iptal edilebilir). Devam edilsin mi?`, 'Tamamla')) return;
      await mesgul(btn, async () => {
        await bosalt();
        const {data, error} = await S.sb.rpc('sayim_tamamla', {p_sayim: id});
        if (error) return toast(hataMesaji(error), 'err');
        await stokYenile();
        const fisler = [data?.giris, data?.cikis].filter(Boolean);
        toast(fisler.length ? `Sayım tamamlandı. Fişler: ${fisler.join(', ')}` : 'Sayım tamamlandı. Fark bulunmadı.');
        rotala();
      });
    };
    $('#iptal').onclick = async e => {
      const btn = e.currentTarget;
      if (!await onayla('Sayımı iptal et', 'Sayım iptal edilecek; stok değişmez. Devam edilsin mi?', 'İptal Et', true)) return;
      await mesgul(btn, async () => {
        const {error} = await S.sb.rpc('sayim_iptal', {p_sayim: id});
        if (error) return toast(hataMesaji(error), 'err');
        toast('Sayım iptal edildi.'); location.hash = '#/sayim';
      });
    };
  }
}

  el.innerHTML = `
  <div class="vtab" id="rt"><button class="on" data-t="stok">Stok Durumu</button><button data-t="hareket">Hareket Dökümü</button>${fy() ? '<button data-t="deger">Stok Değeri</button>' : ''}</div>
  <div id="r-stok" class="glass card">
    <h3>Stok Durumu Raporu</h3>
    <div class="grid g3" style="margin-bottom:14px">
      <label class="f"><span>Kategori</span><select class="inp" id="rs-kat"><option value="">Tümü</option>${kategoriler.map(k => `<option>${esc(k)}</option>`).join('')}</select></label>

      <label class="chk"><input type="checkbox" id="rs-pasif"> Pasifleri dahil et</label>
    </div>
    <div class="row"><button class="btn gold" id="rs-x">${ic('excel')} Excel</button><button class="btn" id="rs-p">${ic('pdf')} PDF</button></div>
  </div>
  <div id="r-hareket" class="glass card hidden">
    <h3>Hareket Dökümü</h3>
    <div class="grid g4" style="margin-bottom:14px">
      <label class="f"><span>Başlangıç</span><input class="inp" type="date" id="rh-bas" value="${isoGun(ayBasi)}"></label>
      <label class="f"><span>Bitiş</span><input class="inp" type="date" id="rh-bit" value="${isoGun(bugun)}"></label>
      <label class="f"><span>Tür</span><select class="inp" id="rh-tip"><option value="">Tümü</option><option value="giris">Giriş</option><option value="cikis">Çıkış</option></select></label>
      <label class="f"><span>Fiş / müşteri / sipariş</span><input class="inp" id="rh-ara" placeholder="İsteğe bağlı"></label>
    </div>
    <div class="row"><button class="btn gold" id="rh-x">${ic('excel')} Excel</button><button class="btn" id="rh-p">${ic('pdf')} PDF</button><span class="sub" id="rh-bilgi"></span></div>
  </div>
  ${fy() ? `<div id="r-deger" class="hidden"><div class="glass card" style="margin-bottom:14px"><h3>Stok Değeri (güncel kurla, ₺)</h3><p class="sub" style="margin-bottom:12px">Kur: USD ${esc(nf4.format(S.ay.usd_kur))} · EUR ${esc(nf4.format(S.ay.eur_kur))}${S.ay.kur_guncelleme ? ' · ' + esc(fTarih(S.ay.kur_guncelleme)) : ''}</p>
    <div class="row"><button class="btn gold" id="rd-x">${ic('excel')} Excel</button><button class="btn" id="rd-p">${ic('pdf')} PDF</button></div></div>
    <div class="glass tw" id="rd-t"></div></div>` : ''}`;
  $$('#rt button').forEach(b => b.onclick = () => {
    $$('#rt button').forEach(x => x.classList.toggle('on', x === b));
    ['stok', 'hareket', 'deger'].forEach(t => $('#r-' + t)?.classList.toggle('hidden', t !== b.dataset.t));
  });

  // Stok durumu
  const stokVeri = () => {
    const kat = $('#rs-kat').value, sadece = $('#rs-sadece').checked, pasif = $('#rs-pasif').checked;

      const u = S.umap[v.urun_id] || {};
      if (!pasif && (!v.aktif || u.aktif === false)) return false;
      if (kat && u.kategori !== kat) return false;
      return !(sadece && v.miktar <= 0);
    });
  };
  const filtreYazi = () => [$('#rs-kat').value ? 'Kategori: ' + $('#rs-kat').value : 'Tüm kategoriler', $('#rs-sadece').checked ? 'sadece stoktakiler' : 'stoksuzlar dahil'].join(' · ');

    if (!l.length) return toast('Rapor için kayıt yok.', 'err');
    const bas = ['Model Kodu', 'Model Adı', 'Kategori', 'Renk', 'Kumaş', 'Ebat', 'SKU', 'Miktar'];
    if (fy()) bas.push('Maliyet', 'Maliyet Döviz', 'Satış', 'Satış Döviz', 'Maliyet Değeri (TL)', 'Satış Değeri (TL)');
    const rows = [bas, ...l.map(v => {
      const u = S.umap[v.urun_id] || {}, f = S.fiyat[v.id];
      const r = [u.model_kodu, u.model_adi, u.kategori, v.renk, v.kumas, v.ebat, v.sku, v.miktar];
      if (fy()) r.push(f ? Number(f.maliyet) : 0, f?.maliyet_doviz || 'TRY', f ? Number(f.satis) : 0, f?.satis_doviz || 'TRY',
        f ? +(v.miktar * tl(f.maliyet, f.maliyet_doviz)).toFixed(2) : 0, f ? +(v.miktar * tl(f.satis, f.satis_doviz)).toFixed(2) : 0);
      return r;
    })];
    excelIndir(`stok-durumu-${isoGun(new Date())}`, 'Stok Durumu', rows);
  };
  $('#rs-p').onclick = () => {
    const l = stokVeri();
    if (!l.length) return toast('Rapor için kayıt yok.', 'err');
    let top = 0, deg = 0;
    const body = l.map(v => {
      const u = S.umap[v.urun_id] || {}, f = S.fiyat[v.id];
      const d = f ? v.miktar * tl(f.maliyet, f.maliyet_doviz) : 0; top += v.miktar; deg += d;
      return `<tr><td>${esc(u.model_kodu)}</td><td>${esc(u.model_adi)}</td><td>${esc(vAd(v))}</td><td>${esc(v.sku)}</td><td class="r">${fAdet(v.miktar)}</td>${fy() ? `<td class="r">${f ? esc(fPara(f.maliyet, f.maliyet_doviz)) : ''}</td><td class="r">${esc(fTL(d))}</td>` : ''}</tr>`;
    }).join('');
    yazdir('Stok Durumu Raporu', `<p>${esc(filtreYazi())}</p><table><thead><tr><th>Model Kodu</th><th>Model</th><th>Varyant</th><th>SKU</th><th class="r">Miktar</th>${fy() ? '<th class="r">Maliyet</th><th class="r">Değer (₺)</th>' : ''}</tr></thead><tbody>${body}
      <tr class="tot"><td colspan="4">Toplam (${fAdet(l.length)} varyant)</td><td class="r">${fAdet(top)}</td>${fy() ? `<td></td><td class="r">${esc(fTL(deg))}</td>` : ''}</tr></tbody></table>`);
  };

  // Hareket dökümü
  const hareketVeri = async () => {
    const f = {bas: $('#rh-bas').value, bit: $('#rh-bit').value, tip: $('#rh-tip').value, ara: $('#rh-ara').value};
    if (f.bas && f.bit && f.bas > f.bit) throw new Error('Başlangıç tarihi bitişten sonra olamaz.');
    const out = [];
    for (let i = 0; i < 50000; i += 1000) {
      $('#rh-bilgi').textContent = `${fAdet(out.length)} kayıt alındı…`;
      const {data, error} = await hareketSorgu(f).range(i, i + 999);
      if (error) throw error;
      out.push(...data);
      if (data.length < 1000) break;
    }
    $('#rh-bilgi').textContent = `${fAdet(out.length)} kayıt.`;
    return {f, l: out.reverse()};
  };
  $('#rh-x').onclick = e => mesgul(e.currentTarget, async () => {
    try {
      const {l} = await hareketVeri();
      if (!l.length) return toast('Bu aralıkta hareket yok.', 'err');
      const bas = ['Tarih', 'Fiş No', 'Tür', 'Neden', 'Müşteri', 'Sipariş No', 'İrsaliye No', 'Model Kodu', 'Model Adı', 'Varyant', 'SKU', 'Miktar', 'Kalan', 'Kullanıcı', 'Açıklama', 'Durum'];
      if (fy()) bas.push('Birim Fiyat', 'Döviz', 'Kur', 'Tutar (TL)');
      const rows = [bas, ...l.map(h => {
        const f = h.fisler, v = S.vmap[h.varyant_id] || {}, u = S.umap[v.urun_id] || {}, p = hfOf(h);
        const r = [fTarih(h.created_at), f.fis_no, TIP[f.tip], f.neden, f.musteri, f.siparis_no, f.irsaliye_no, u.model_kodu, u.model_adi, vAd(v), v.sku, h.yon * h.miktar, h.kalan_sonra, f.kullanici_adi, f.aciklama, f.iptal_edildi ? 'İptal edildi' : ''];
        if (fy()) r.push(p ? Number(p.birim_fiyat) : '', p?.doviz || '', p ? Number(p.kur) : '', p ? h.yon * Number(p.tutar_tl) : '');
        return r;
      })];
      excelIndir(`hareket-dokumu-${$('#rh-bas').value}_${$('#rh-bit').value}`, 'Hareketler', rows);
    } catch (er) { toast(hataMesaji(er), 'err'); }
  });
  $('#rh-p').onclick = e => mesgul(e.currentTarget, async () => {
    try {
      const {f, l} = await hareketVeri();
      if (!l.length) return toast('Bu aralıkta hareket yok.', 'err');
      if (l.length > 5000) toast('Kayıt sayısı yüksek; büyük raporlar için Excel önerilir.');
      let gir = 0, cik = 0, tg = 0, tc = 0;
      const body = l.map(h => {
        const fs = h.fisler, v = S.vmap[h.varyant_id] || {}, u = S.umap[v.urun_id] || {}, p = hfOf(h);
        if (h.yon > 0) { gir += h.miktar; tg += Number(p?.tutar_tl) || 0; } else { cik += h.miktar; tc += Number(p?.tutar_tl) || 0; }
        return `<tr><td>${esc(fTarih(h.created_at))}</td><td>${esc(fs.fis_no)}${fs.iptal_edildi ? ' (iptal)' : ''}</td><td>${TIP[fs.tip]} · ${esc(fs.neden)}</td><td>${esc(u.model_kodu)} ${esc(u.model_adi)} — ${esc(vAd(v))}</td><td>${esc(fs.musteri)}${fs.siparis_no ? ' · Sip: ' + esc(fs.siparis_no) : ''}</td><td class="r">${h.yon > 0 ? '+' : '−'}${fAdet(h.miktar)}</td><td class="r">${fAdet(h.kalan_sonra)}</td>${fy() ? `<td class="r">${p ? esc(fTL(p.tutar_tl)) : ''}</td>` : ''}<td>${esc(fs.kullanici_adi)}</td></tr>`;
      }).join('');
      yazdir('Hareket Dökümü', `<p>${esc(fGun(f.bas))} – ${esc(fGun(f.bit))}${f.tip ? ' · ' + TIP[f.tip] : ''}${f.ara ? ' · Arama: ' + esc(f.ara) : ''}</p>
        <table><thead><tr><th>Tarih</th><th>Fiş</th><th>Tür / Neden</th><th>Ürün</th><th>Müşteri</th><th class="r">Miktar</th><th class="r">Kalan</th>${fy() ? '<th class="r">Tutar (₺)</th>' : ''}<th>Kullanıcı</th></tr></thead><tbody>${body}</tbody></table>
        <table style="width:auto;margin-top:12px"><tr class="tot"><td>Toplam giriş</td><td class="r">${fAdet(gir)} adet</td>${fy() ? `<td class="r">${esc(fTL(tg))}</td>` : ''}</tr><tr class="tot"><td>Toplam çıkış</td><td class="r">${fAdet(cik)} adet</td>${fy() ? `<td class="r">${esc(fTL(tc))}</td>` : ''}</tr></table>`, true);
    } catch (er) { toast(hataMesaji(er), 'err'); }
  });

  // Stok değeri
  if (fy()) {
    const grup = {};
    S.varyantlar.forEach(v => {
      const u = S.umap[v.urun_id] || {}; if (!v.aktif || u.aktif === false || v.miktar <= 0) return;
      const k = u.kategori || 'Kategorisiz', f = S.fiyat[v.id];
      const g = grup[k] ||= {adet: 0, mal: 0, sat: 0, cesit: 0};
      g.adet += v.miktar; g.cesit++;
      if (f) { g.mal += v.miktar * tl(f.maliyet, f.maliyet_doviz); g.sat += v.miktar * tl(f.satis, f.satis_doviz); }
    });
    const keys = Object.keys(grup).sort((a, b) => a.localeCompare(b, 'tr'));
    const T = keys.reduce((a, k) => ({adet: a.adet + grup[k].adet, mal: a.mal + grup[k].mal, sat: a.sat + grup[k].sat, cesit: a.cesit + grup[k].cesit}), {adet: 0, mal: 0, sat: 0, cesit: 0});
    $('#rd-t').innerHTML = keys.length ? `<table class="rt"><thead><tr><th>Kategori</th><th class="r">Varyant</th><th class="r">Adet</th><th class="r">Maliyet Değeri</th><th class="r">Satış Değeri</th><th class="r">Potansiyel Kâr</th></tr></thead><tbody>
      ${keys.map(k => { const g = grup[k]; return `<tr><td class="hd" data-l="Kategori">${esc(k)}</td><td class="r num" data-l="Varyant">${fAdet(g.cesit)}</td><td class="r num" data-l="Adet">${fAdet(g.adet)}</td><td class="r num" data-l="Maliyet">${esc(fTL(g.mal))}</td><td class="r num" data-l="Satış">${esc(fTL(g.sat))}</td><td class="r num" data-l="Kâr">${esc(fTL(g.sat - g.mal))}</td></tr>`; }).join('')}
      <tr><td class="hd" data-l=""><b class="gold-t">TOPLAM</b></td><td class="r num" data-l="Varyant"><b>${fAdet(T.cesit)}</b></td><td class="r num" data-l="Adet"><b>${fAdet(T.adet)}</b></td><td class="r num" data-l="Maliyet"><b>${esc(fTL(T.mal))}</b></td><td class="r num" data-l="Satış"><b>${esc(fTL(T.sat))}</b></td><td class="r num" data-l="Kâr"><b class="gold-t">${esc(fTL(T.sat - T.mal))}</b></td></tr>
      </tbody></table>` : '<div class="empty">Stokta ürün yok.</div>';
    $('#rd-x').onclick = () => excelIndir(`stok-degeri-${isoGun(new Date())}`, 'Stok Değeri', [
      ['Kategori', 'Varyant', 'Adet', 'Maliyet Değeri (TL)', 'Satış Değeri (TL)', 'Potansiyel Kâr (TL)'],
      ...keys.map(k => [k, grup[k].cesit, grup[k].adet, +grup[k].mal.toFixed(2), +grup[k].sat.toFixed(2), +(grup[k].sat - grup[k].mal).toFixed(2)]),
      ['TOPLAM', T.cesit, T.adet, +T.mal.toFixed(2), +T.sat.toFixed(2), +(T.sat - T.mal).toFixed(2)]
    ]);
    $('#rd-p').onclick = () => yazdir('Stok Değeri Raporu', `<p>Kur: USD ${esc(nf4.format(S.ay.usd_kur))} · EUR ${esc(nf4.format(S.ay.eur_kur))}</p>
      <table><thead><tr><th>Kategori</th><th class="r">Varyant</th><th class="r">Adet</th><th class="r">Maliyet Değeri</th><th class="r">Satış Değeri</th><th class="r">Potansiyel Kâr</th></tr></thead><tbody>
      ${keys.map(k => { const g = grup[k]; return `<tr><td>${esc(k)}</td><td class="r">${fAdet(g.cesit)}</td><td class="r">${fAdet(g.adet)}</td><td class="r">${esc(fTL(g.mal))}</td><td class="r">${esc(fTL(g.sat))}</td><td class="r">${esc(fTL(g.sat - g.mal))}</td></tr>`; }).join('')}
      <tr class="tot"><td>TOPLAM</td><td class="r">${fAdet(T.cesit)}</td><td class="r">${fAdet(T.adet)}</td><td class="r">${esc(fTL(T.mal))}</td><td class="r">${esc(fTL(T.sat))}</td><td class="r">${esc(fTL(T.sat - T.mal))}</td></tr></tbody></table>`);
  }
};

/* ---------- Ürünler (yönetici) ---------- */
VIEWS.urunler = el => {
  $('#ust').innerHTML = `<button class="btn gold" id="yeni">${ic('arti')} Yeni Ürün</button>`;
  el.innerHTML = `<div class="glass filters"><label class="f"><span>Ara</span><input class="inp" id="q" placeholder="Model kodu, adı, kategori…"></label><label class="chk"><input type="checkbox" id="pasif"> Pasifleri göster</label></div><div class="glass tw" id="liste"></div>`;
  const ciz = () => {
    const q = trLower($('#q').value).split(/\s+/).filter(Boolean), pasif = $('#pasif').checked;
    const l = S.urunler.filter(u => (pasif || u.aktif) && q.every(t => trLower(`${u.model_kodu} ${u.model_adi} ${u.kategori}`).includes(t)));
    $('#liste').innerHTML = l.length ? `<table class="rt"><thead><tr><th>Model Kodu</th><th>Model Adı</th><th>Kategori</th><th class="r">Varyant</th><th class="r">Toplam Stok</th><th>Durum</th></tr></thead><tbody>
      ${l.map(u => { const vs = S.varyantlar.filter(v => v.urun_id === u.id); return `<tr class="cl" data-u="${u.id}">
        <td class="hd" data-l="Model Kodu"><b class="gold-t">${esc(u.model_kodu)}</b></td><td data-l="Model Adı">${esc(u.model_adi)}</td><td data-l="Kategori">${esc(u.kategori || '—')}</td>
        <td class="r num" data-l="Varyant">${fAdet(vs.length)}</td><td class="r num" data-l="Toplam Stok">${fAdet(vs.reduce((a, v) => a + v.miktar, 0))}</td>
        <td data-l="Durum">${u.aktif ? '<span class="tag g">Aktif</span>' : '<span class="tag">Pasif</span>'}</td></tr>`; }).join('')}</tbody></table>`
      : `<div class="empty">${S.urunler.length ? 'Kayıt bulunamadı.' : 'Henüz ürün yok. "Yeni Ürün" ile başlayın.'}</div>`;
    $$('[data-u]', el).forEach(tr => tr.onclick = () => urunDuzenle(+tr.dataset.u));
  };
  $('#q').oninput = debounce(ciz, 150);
  $('#pasif').onchange = ciz;
  $('#yeni').onclick = () => urunDuzenle(null);
  ciz();
  S.canli = {yerel: () => { if (!document.querySelector('.ov')) ciz(); }};
};

function urunDuzenle(id) {
  const u = id ? S.umap[id] : {model_kodu: '', model_adi: '', kategori: '', aciklama: '', aktif: true};
  const vs = id ? S.varyantlar.filter(v => v.urun_id === id) : [];
  const silinen = [];
  const kategoriler = [...new Set(S.urunler.map(x => x.kategori).filter(Boolean))];
  const doviz = (n, d) => `<select class="inp" data-k="${n}">${['TRY', 'USD', 'EUR'].map(x => `<option value="${x}" ${x === d ? 'selected' : ''}>${SYM[x]} ${x === 'TRY' ? 'TL' : x}</option>`).join('')}</select>`;
  const vSatir = (v = {}) => {
    const f = v.id ? S.fiyat[v.id] || {} : {};
    return `<tr data-vid="${v.id || ''}">
      <td data-l="Renk"><input class="inp" data-k="renk" maxlength="80" value="${esc(v.renk)}"></td>
      <td data-l="Kumaş"><input class="inp" data-k="kumas" maxlength="80" value="${esc(v.kumas)}"></td>
      <td data-l="Ebat"><input class="inp" data-k="ebat" maxlength="80" value="${esc(v.ebat)}"></td>
      <td data-l="SKU"><input class="inp" data-k="sku" maxlength="80" value="${esc(v.sku)}" placeholder="Otomatik"></td>
      ${FIYAT_AKTIF ? `<td data-l="Maliyet"><div class="row" style="flex-wrap:nowrap;gap:6px"><input class="inp num" data-k="maliyet" inputmode="decimal" style="min-width:80px" value="${f.maliyet != null ? esc(nf2.format(f.maliyet)) : ''}">${doviz('maliyet_doviz', f.maliyet_doviz || 'TRY')}</div></td>
      <td data-l="Satış"><div class="row" style="flex-wrap:nowrap;gap:6px"><input class="inp num" data-k="satis" inputmode="decimal" style="min-width:80px" value="${f.satis != null ? esc(nf2.format(f.satis)) : ''}">${doviz('satis_doviz', f.satis_doviz || 'TRY')}</div></td>` : ''}
      <td data-l="Stok" class="r num">${v.id ? fAdet(v.miktar) : '—'}</td>
      <td data-l="Aktif"><label class="chk"><input type="checkbox" data-k="aktif" ${v.aktif !== false ? 'checked' : ''}></label></td>
      <td class="act"><button type="button" class="btn icon sm red" data-sil title="Varyantı sil" aria-label="Varyantı sil">${ic('cop')}</button></td></tr>`;
  };
  const m = modal({
    baslik: id ? `Ürün Düzenle — ${esc(u.model_kodu)}` : 'Yeni Ürün', genis: true,
    govde: `<form id="fu" autocomplete="off" class="stack">
      <div class="grid g4">
        <label class="f"><span>Model Kodu *</span><input class="inp" name="model_kodu" maxlength="60" required value="${esc(u.model_kodu)}"></label>
        <label class="f" style="grid-column:span 2"><span>Model Adı *</span><input class="inp" name="model_adi" maxlength="160" required value="${esc(u.model_adi)}"></label>
        <label class="f"><span>Kategori</span><input class="inp" name="kategori" maxlength="80" list="katl" value="${esc(u.kategori)}"><datalist id="katl">${kategoriler.map(k => `<option value="${esc(k)}">`).join('')}</datalist></label>
        <label class="f" style="grid-column:1/-1"><span>Açıklama</span><input class="inp" name="aciklama" maxlength="1000" value="${esc(u.aciklama)}"></label>
      </div>
      <label class="chk"><input type="checkbox" name="aktif" ${u.aktif ? 'checked' : ''}> Ürün aktif</label>
      <div><div class="row" style="margin-bottom:10px"><h3 style="margin:0">Varyantlar</h3><span class="sub">Renk / kumaş / ebat boş bırakılırsa "Standart" olur.</span><span class="sp"></span><button type="button" class="btn sm" id="vekle">${ic('arti')} Varyant Ekle</button></div>
        <div class="glass tw"><table class="rt"><thead><tr><th>Renk</th><th>Kumaş</th><th>Ebat</th><th>SKU</th>${FIYAT_AKTIF ? '<th>Maliyet</th><th>Satış</th>' : ''}<th class="r">Stok</th><th>Aktif</th><th></th></tr></thead><tbody id="vt">${(vs.length ? vs : [{}]).map(vSatir).join('')}</tbody></table></div>
      </div></form>`,
    alt: `${id ? `<button class="btn red" data-usil>${ic('cop')} Ürünü Sil</button><span class="sp"></span>` : ''}<button class="btn" data-kapat>Vazgeç</button><button class="btn gold" data-kaydet>Kaydet</button>`
  });
  const vt = $('#vt', m);
  const bagla = () => $$('[data-sil]', vt).forEach(b => b.onclick = () => {
    const tr = b.closest('tr');
    if (tr.dataset.vid) {
      const v = S.vmap[tr.dataset.vid];
      if (v && v.miktar > 0) return toast('Stoğu olan varyant silinemez; pasif yapın.', 'err');
      silinen.push(+tr.dataset.vid);
    }
    tr.remove();
    if (!$('tr', vt)) { vt.insertAdjacentHTML('beforeend', vSatir()); bagla(); }
  });
  bagla();
  $('#vekle', m).onclick = () => { vt.insertAdjacentHTML('beforeend', vSatir()); bagla(); $('tr:last-child input', vt).focus(); };

  $('[data-kaydet]', m).onclick = e => {
    const fm = $('#fu', m);
    const kod = fm.model_kodu.value.trim(), ad = fm.model_adi.value.trim();
    if (!kod) { fm.model_kodu.focus(); return toast('Model kodu zorunlu.', 'err'); }
    if (!ad) { fm.model_adi.focus(); return toast('Model adı zorunlu.', 'err'); }
    const skular = new Set();
    const varyantlar = [];
    
    const ascii = x => x.toLocaleUpperCase('tr-TR').replace(/[ÇĞİÖŞÜ]/g, c => ({Ç:'C',Ğ:'G',İ:'I',Ö:'O',Ş:'S',Ü:'U'}[c]));
    const kisalt = x => ascii(x.trim()).replace(/[^A-Z0-9]+/g, '').slice(0, 4);
    const temizKod = ascii(kod).replace(/\s+/g, '-');
    for (const [i, tr] of $$('tr', vt).entries()) {
      const g = k => $(`[data-k="${k}"]`, tr);
      let sku = g('sku').value.trim();
      if (!sku) {
        const parca = [g('renk').value, g('kumas').value, g('ebat').value].map(kisalt).filter(Boolean).join('-');
        sku = `${temizKod}${parca ? '-' + parca : ''}`;
        let n = 2, aday = sku;
        while (skular.has(trLower(aday)) || S.varyantlar.some(v => trLower(v.sku) === trLower(aday) && String(v.id) !== tr.dataset.vid)) aday = `${sku}-${n++}`;
        sku = aday; g('sku').value = sku;
      }
      if (skular.has(trLower(sku))) { g('sku').focus(); return toast(`SKU tekrar ediyor: ${sku}`, 'err'); }
      skular.add(trLower(sku));
      const vr = {id: tr.dataset.vid || null, renk: g('renk').value.trim(), kumas: g('kumas').value.trim(), ebat: g('ebat').value.trim(), sku, aktif: g('aktif').checked};
      if (FIYAT_AKTIF) {
        const mal = g('maliyet').value.trim(), sat = g('satis').value.trim();
        const malN = mal ? parseNum(mal) : 0, satN = sat ? parseNum(sat) : 0;
        if (isNaN(malN) || malN < 0) { g('maliyet').focus(); return toast(`${i + 1}. varyantta maliyet geçersiz.`, 'err'); }
        if (isNaN(satN) || satN < 0) { g('satis').focus(); return toast(`${i + 1}. varyantta satış fiyatı geçersiz.`, 'err'); }
        Object.assign(vr, {maliyet: String(malN), maliyet_doviz: g('maliyet_doviz').value, satis: String(satN), satis_doviz: g('satis_doviz').value});
      }
      varyantlar.push(vr);
    }
    const p = {id: id || null, model_kodu: kod, model_adi: ad, kategori: fm.kategori.value.trim(), aciklama: fm.aciklama.value.trim(), aktif: fm.aktif.checked, varyantlar, silinen};
    mesgul(e.currentTarget, async () => {
      const {error} = await S.sb.rpc('urun_kaydet', {p});
      if (error) return toast(hataMesaji(error), 'err');
      await katalogYukle();
      toast('Ürün kaydedildi.');
      m.kapat(); rotala();
    });
  };
  const us = $('[data-usil]', m);
  if (us) us.onclick = async () => {
    if (!await onayla('Ürünü sil', `<b>${esc(u.model_kodu)}</b> ve tüm varyantları silinecek. Hareketi olan ürün silinemez; bu durumda pasif yapın. Devam edilsin mi?`, 'Sil', true)) return;
    const {error} = await S.sb.rpc('urun_sil', {p_id: id});
    if (error) return toast(hataMesaji(error), 'err');
    await katalogYukle(); toast('Ürün silindi.'); m.kapat(); rotala();
  };
}

/* ---------- Kullanıcılar (yönetici) ---------- */
VIEWS.kullanicilar = async el => {
  const {data, error} = await S.sb.from('profiles').select('*').order('created_at');
  if (error) throw error;
  $('#ust').innerHTML = `<button class="btn gold" id="yeni">${ic('arti')} Yeni Kullanıcı</button>`;
  const bekleyen = data.filter(p => !p.aktif).length;
  el.innerHTML = `${bekleyen ? `<div class="warn">${bekleyen} hesap pasif / onay bekliyor.</div>` : ''}
  <div class="glass tw"><table class="rt"><thead><tr><th>Ad Soyad</th><th>E-posta</th><th>Rol</th><th>Durum</th><th>Kayıt</th></tr></thead><tbody>
  ${data.map(p => `<tr class="cl" data-p="${p.id}"><td class="hd" data-l="Ad">${esc(p.ad_soyad || '—')} ${p.id === S.user.id ? '<span class="tag y">Siz</span>' : ''}</td><td data-l="E-posta">${esc(p.email)}</td>
    <td data-l="Rol"><span class="tag ${p.rol === 'yonetici' ? 'y' : 'b'}">${p.rol === 'yonetici' ? 'Yönetici' : 'Depocu'}</span></td>
    <td data-l="Durum">${p.aktif ? '<span class="tag g">Aktif</span>' : '<span class="tag r">Pasif</span>'}</td><td class="num" data-l="Kayıt">${esc(fGun(p.created_at))}</td></tr>`).join('')}
  </tbody></table></div>`;
  $$('[data-p]', el).forEach(tr => tr.onclick = () => {
    const p = data.find(x => x.id === tr.dataset.p);
    const m = modal({
      baslik: esc(p.ad_soyad || p.email),
      govde: `<div class="grid g2"><label class="f" style="grid-column:1/-1"><span>Ad Soyad</span><input class="inp" id="ka" maxlength="120" value="${esc(p.ad_soyad)}"></label>
        <label class="f"><span>Rol</span><select class="inp" id="kr"><option value="depocu" ${p.rol === 'depocu' ? 'selected' : ''}>Depocu</option><option value="yonetici" ${p.rol === 'yonetici' ? 'selected' : ''}>Yönetici</option></select></label>
        <label class="f"><span>Durum</span><select class="inp" id="kd"><option value="1" ${p.aktif ? 'selected' : ''}>Aktif</option><option value="0" ${!p.aktif ? 'selected' : ''}>Pasif</option></select></label></div>
        <p class="sub" style="margin-top:12px">${esc(p.email)} · Depocu ürün, kullanıcı ve ayarları yönetemez; fiş iptal edemez. Şifre unutulursa kullanıcı giriş ekranındaki "Şifremi unuttum" ile yeniler.</p>`,
      alt: `<button class="btn" data-kapat>Vazgeç</button><button class="btn gold" data-ok>Kaydet</button>`
    });
    $('[data-ok]', m).onclick = e => mesgul(e.currentTarget, async () => {
      const {error} = await S.sb.rpc('kullanici_guncelle', {p_id: p.id, p_ad: $('#ka', m).value.trim(), p_rol: $('#kr', m).value, p_aktif: $('#kd', m).value === '1'});
      if (error) return toast(hataMesaji(error), 'err');
      toast('Kullanıcı güncellendi.'); m.kapat(); rotala();
    });
  });
  $('#yeni').onclick = () => {
    const m = modal({
      baslik: 'Yeni Kullanıcı',
      govde: `<form id="fk" class="grid g2" autocomplete="off">
        <label class="f" style="grid-column:1/-1"><span>Ad Soyad *</span><input class="inp" name="ad" maxlength="120" required></label>
        <label class="f"><span>E-posta *</span><input class="inp" type="email" name="e" maxlength="120" required autocomplete="off"></label>
        <label class="f"><span>Geçici şifre * (en az 8)</span><input class="inp" type="text" name="p" minlength="8" maxlength="72" required autocomplete="new-password"></label>
        <label class="f"><span>Rol</span><select class="inp" name="r"><option value="depocu">Depocu</option><option value="yonetici">Yönetici</option></select></label>
      </form><p class="sub" style="margin-top:12px">Kullanıcı bu e-posta ve şifreyle giriş yapar; ilk girişte "Hesabım" ekranından şifresini değiştirmesini isteyin.</p>`,
      alt: `<button class="btn" data-kapat>Vazgeç</button><button class="btn gold" data-ok>Oluştur</button>`
    });
    $('[data-ok]', m).onclick = e => {
      const fk = $('#fk', m);
      if (!fk.reportValidity()) return;
      mesgul(e.currentTarget, async () => {
        const c = config();
        const ayri = supabase.createClient(c.SUPABASE_URL, c.SUPABASE_KEY, {auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'ofs_gecici'}});
        const {data: d, error} = await ayri.auth.signUp({email: fk.e.value.trim(), password: fk.p.value, options: {data: {ad_soyad: fk.ad.value.trim()}}});
        if (error) return toast(hataMesaji(error), 'err');
        if (!d.user || (d.user.identities && d.user.identities.length === 0)) return toast('Bu e-posta ile kayıtlı bir kullanıcı zaten var.', 'err');
        const {error: e2} = await S.sb.rpc('kullanici_guncelle', {p_id: d.user.id, p_ad: fk.ad.value.trim(), p_rol: fk.r.value, p_aktif: true});
        if (e2) return toast(hataMesaji(e2), 'err');
        toast(d.session ? 'Kullanıcı oluşturuldu.' : 'Kullanıcı oluşturuldu. E-posta onayı açıksa kullanıcı önce e-postasını onaylamalı.');
        m.kapat(); rotala();
      });
    };
  };
};

/* ---------- Ayarlar (yönetici) ---------- */
function logoOku(dosya) {
  return new Promise((res, rej) => {
    const tipler = ['image/png', 'image/jpeg', 'image/webp', 'image/svg+xml'];
    if (!tipler.includes(dosya.type)) return rej(new Error('Yalnızca PNG, JPG, WEBP veya SVG yükleyebilirsiniz.'));
    if (dosya.size > 5 * 1024 * 1024) return rej(new Error('Dosya 5 MB’dan büyük olamaz.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Dosya okunamadı.'));
    fr.onload = () => {
      const url = fr.result;
      if (dosya.type === 'image/svg+xml') {
        if (url.length > 400000) return rej(new Error('SVG dosyası çok büyük (en fazla ~290 KB).'));
        return res(url);
      }
      const img = new Image();
      img.onerror = () => rej(new Error('Görsel açılamadı.'));
      img.onload = () => {
        const olcek = Math.min(1, 800 / img.width, 240 / img.height);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * olcek)); c.height = Math.max(1, Math.round(img.height * olcek));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let out = c.toDataURL('image/png');
        if (out.length > 400000) out = c.toDataURL('image/webp', 0.9);
        if (out.length > 400000) return rej(new Error('Logo küçültüldükten sonra da çok büyük. Daha sade bir dosya deneyin.'));
        res(out);
      };
      img.src = url;
    };
    fr.readAsDataURL(dosya);
  });
}

VIEWS.ayarlar = el => {
  const lg = {acik: guvenliLogo(S.ay.logo_acik), koyu: guvenliLogo(S.ay.logo_koyu)};
  const onizle = () => ['acik', 'koyu'].forEach(t => {
    const src = lg[t] || lg[t === 'acik' ? 'koyu' : 'acik'];
    $(`#lp-${t}`).innerHTML = src ? `<img src="${src}" alt="${t === 'acik' ? 'Açık tema logosu' : 'Koyu tema logosu'}">`
      : `<span style="display:flex;align-items:center;gap:10px"><span class="mark" style="${t === 'koyu' ? 'background:#fafafa;color:#09090b' : 'background:#18181b;color:#fafafa'}">${esc(firmaAdi().charAt(0))}</span><b style="letter-spacing:.14em">${esc(firmaAdi())}</b></span>`;
    $(`#lk-${t}`).classList.toggle('hidden', !lg[t]);
    $(`#ln-${t}`).textContent = lg[t] ? 'Yüklendi' : (lg[t === 'acik' ? 'koyu' : 'acik'] ? 'Diğer logo kullanılıyor' : 'Yazı logo kullanılıyor');
  });
  el.innerHTML = `
  <form id="fa" class="glass" style="max-width:760px">
    <div class="ch"><div class="ct">Genel</div><div class="cd">${FIYAT_AKTIF ? 'Firma adı ve döviz kurları' : 'Firma adı'}</div></div>
    <div class="cc stack">
      <label class="f"><span>Firma adı</span><input class="inp" name="firma" maxlength="120" required value="${esc(S.ay.firma_adi)}"></label>
      ${FIYAT_AKTIF ? `<div class="grid g2">
        <label class="f"><span>1 USD = ? TL</span><input class="inp num" name="usd" inputmode="decimal" value="${esc(nf4.format(S.ay.usd_kur))}"></label>
        <label class="f"><span>1 EUR = ? TL</span><input class="inp num" name="eur" inputmode="decimal" value="${esc(nf4.format(S.ay.eur_kur))}"></label>
      </div>
      <p class="sub">${S.ay.kur_guncelleme ? `Son kur güncellemesi: ${esc(fTarih(S.ay.kur_guncelleme))}${S.ay.guncelleyen ? ' · ' + esc(S.ay.guncelleyen) : ''}. ` : ''}Kur değişikliği yalnızca bundan sonraki fişleri etkiler; kayıtlı fişler kendi kurlarıyla kalır.</p>` : ''}
      <div class="row end"><button class="btn gold">Kaydet</button></div>
    </div>
  </form>
  <div class="glass" style="max-width:760px">
    <div class="ch"><div class="ct">Logo</div><div class="cd">Açık ve koyu tema için ayrı logo yükleyin. Yalnızca birini yüklerseniz iki temada da o kullanılır. Logo menüde, giriş ekranında ve PDF çıktılarında görünür.</div></div>
    <div class="cc stack">
      <div class="lgup">${['acik', 'koyu'].map(t => `<div class="lgz">
        <div class="row"><b style="font-weight:500">${t === 'acik' ? 'Açık tema logosu' : 'Koyu tema logosu'}</b><span class="sp"></span><span class="sub" id="ln-${t}"></span></div>
        <div class="lgp ${t}" id="lp-${t}"></div>
        <div class="row"><label class="btn sm" style="cursor:pointer">${ic('yukle')} Dosya seç<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" data-lg="${t}" hidden></label>
          <button type="button" class="btn sm ghost red hidden" id="lk-${t}" data-lk="${t}">${ic('cop')} Kaldır</button></div>
        <p class="sub">${t === 'acik' ? 'Beyaz zeminde görünecek; koyu renkli logo önerilir.' : 'Siyah zeminde görünecek; açık renkli logo önerilir.'} PNG, SVG, WEBP veya JPG.</p>
      </div>`).join('')}</div>
      <div class="row end"><button type="button" class="btn gold" id="lg-kaydet">Logoları kaydet</button></div>
    </div>
  </div>`;
  onizle();
  $$('[data-lg]', el).forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; inp.value = '';
    if (!f) return;
    try { lg[inp.dataset.lg] = await logoOku(f); onizle(); toast('Logo hazır. Kaydetmeyi unutmayın.'); }
    catch (e) { toast(hataMesaji(e), 'err'); }
  });
  $$('[data-lk]', el).forEach(b => b.onclick = () => { lg[b.dataset.lk] = null; onizle(); });
  $('#lg-kaydet').onclick = e => mesgul(e.currentTarget, async () => {
    const {error} = await S.sb.from('ayarlar').update({logo_acik: lg.acik, logo_koyu: lg.koyu}).eq('id', 1);
    if (error) return toast(hataMesaji(error), 'err');
    await ayarYukle(); markaKaydet(S.ay);
    toast('Logolar kaydedildi.');
    iskelet(); rotala();
  });
  $('#fa').onsubmit = e => {
    e.preventDefault();
    const fm = e.target;
    const firma = fm.firma.value.trim();
    if (!firma) return toast('Firma adı boş olamaz.', 'err');
    const guncel = {firma_adi: firma};
    if (FIYAT_AKTIF) {
      const usd = parseNum(fm.usd.value), eur = parseNum(fm.eur.value);
      if (isNaN(usd) || usd < 0 || usd > 100000) return toast('USD kuru geçersiz.', 'err');
      if (isNaN(eur) || eur < 0 || eur > 100000) return toast('EUR kuru geçersiz.', 'err');
      Object.assign(guncel, {usd_kur: usd, eur_kur: eur});
    }
    mesgul($('button.gold', fm), async () => {
      const {error} = await S.sb.from('ayarlar').update(guncel).eq('id', 1);
      if (error) return toast(hataMesaji(error), 'err');
      await ayarYukle(); markaKaydet(S.ay);
      toast('Ayarlar kaydedildi.');
      iskelet(); rotala();
    });
  };
};

VIEWS.hesap = el => {
  el.innerHTML = `<div class="glass card stack" style="max-width:520px">
    <div><div class="sub">Ad Soyad</div><b>${esc(S.prof.ad_soyad || '—')}</b></div>
    <div><div class="sub">E-posta</div>${esc(S.user.email)}</div>
    <div><div class="sub">Rol</div>${yon() ? 'Yönetici' : 'Depocu'}</div>
  </div>
  <form id="fs" class="glass card stack" style="max-width:520px;margin-top:14px">
    <h3 style="margin:0">Şifre Değiştir</h3>
    <label class="f"><span>Yeni şifre</span><input class="inp" type="password" name="p" minlength="8" maxlength="72" required autocomplete="new-password"></label>
    <label class="f"><span>Yeni şifre (tekrar)</span><input class="inp" type="password" name="p2" minlength="8" maxlength="72" required autocomplete="new-password"></label>
    <div class="row end"><button class="btn gold">Şifreyi Güncelle</button></div>
  </form>`;
  $('#fs').onsubmit = e => {
    e.preventDefault();
    const fm = e.target;
    if (fm.p.value !== fm.p2.value) return toast('Şifreler aynı değil.', 'err');
    mesgul($('button', fm), async () => {
      const {error} = await S.sb.auth.updateUser({password: fm.p.value});
      if (error) return toast(hataMesaji(error), 'err');
      fm.reset(); toast('Şifreniz güncellendi.');
    });
  };
};

/* ---------- Açılış ---------- */
(async function () {
  temaUygula();
  if (!window.supabase) { $('#root').innerHTML = '<div class="auth"><div class="box glass empty">Gerekli kütüphane yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</div></div>'; return; }
  const c = config();
  if (!c) return ekranBaglanti();
  S.sb = supabase.createClient(c.SUPABASE_URL, c.SUPABASE_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'ofs_stok_oturum'}});
  let kurtarma = /type=recovery/.test(location.hash);
  S.sb.auth.onAuthStateChange((ev) => {
    if (ev === 'PASSWORD_RECOVERY') { kurtarma = true; ekranGiris('yeni'); }
    if (ev === 'SIGNED_OUT' && S.prof) { S.prof = null; ekranGiris(); }
  });
  await markaYukle();
  if (kurtarma) { setTimeout(() => { if (!$('#fy') && !S.prof) baslat(); }, 4000); return; }
  await baslat();
})();
</script>
